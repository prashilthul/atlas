[project]
name = "paper-pilot-backend"
version = "0.1.0"
description = "Paper Pilot - AI-powered paper analysis backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "httpx",
    "pypdf2",
    "pymupdf",
    "tiktoken",
    "sqlalchemy",
    "asyncpg",
    "psycopg2-binary",
    "sse-starlette",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "deepeval",
    "pandas",
    "pydantic-settings",
    "pgvector",
    "alembic",
    "sentence-transformers",
    "python-multipart>=0.0.32",
    "ragas>=0.4.3",
    "datasets>=5.0.1",
    "torch>=2.13.0",
]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 120
target-version = "py312"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
